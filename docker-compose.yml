# Para VPS: docker compose up -d --build
# Crie um arquivo .env ao lado deste (copie de .env.example) — ele NÃO vai para o Git.
services:
  nexus:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
