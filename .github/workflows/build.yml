name: Verify Next.js build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rls
      - name: Build com iscas nas variáveis de servidor
        run: npm run build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ISCA_SERVICE_ROLE_9f3c7a
          META_APP_SECRET: ISCA_META_SECRET_51b2
          META_WEBHOOK_VERIFY_TOKEN: ISCA_META_VERIFY_77d0
          ANTHROPIC_API_KEY: ISCA_ANTHROPIC_0c4e
          ASSISTANT_API_KEY: ISCA_ASSISTENTE_8a1f
          OPENAI_API_KEY: ISCA_OPENAI_3e9d
      - name: Nenhum segredo de servidor no bundle do navegador
        run: npm run test:secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ISCA_SERVICE_ROLE_9f3c7a
          META_APP_SECRET: ISCA_META_SECRET_51b2
          META_WEBHOOK_VERIFY_TOKEN: ISCA_META_VERIFY_77d0
          ANTHROPIC_API_KEY: ISCA_ANTHROPIC_0c4e
          ASSISTANT_API_KEY: ISCA_ASSISTENTE_8a1f
          OPENAI_API_KEY: ISCA_OPENAI_3e9d

  experience:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qhizuqcdxivdvjtefofz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ui-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
