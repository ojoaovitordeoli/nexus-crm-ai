name: Verify Next.js build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  experience:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qhizuqcdxivdvjtefofz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ui-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
